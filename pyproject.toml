[project]
name = "agent-toolbox"
version = "0.0.0"
description = "Workspace root for agent-toolbox's Python packages"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.1a1"]

[tool.ty.environment]
# `tests/test_acp_bridge.py` puts the SWE MCP directory on `sys.path`; the
# bridge ships as a plugin-root script rather than a package.
extra-paths = ["plugins/swe/mcp"]
