\* A model small enough for the statechart chart (under 500 states).
CONSTANTS
    Workers = {w1, w2}
    Runs = {r1, r2}
    Stop = 2
    Cost = 1
    Caps = {5}
    Ends = {"known", "started"}
    MaxFailures = 3
    MaxRestarts = 1
    InFlight = "active"
    MoveAside = "reserve"
SPECIFICATION Spec
INVARIANTS CapSafe NoFalseStop
