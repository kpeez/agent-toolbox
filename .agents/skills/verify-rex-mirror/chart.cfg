\* The chart config: one mirror, no session-end hook and no waiter, so the
\* chart stays under the statechart budget. scripts/check.py covers the rest.
CONSTANTS
  Mirrors = {"m1"}
  Codes = {0, 1}
  Kinds = {"plain"}
  KillFrom = "start"
  ReplyCanTimeOut = FALSE
  EndOn = FALSE
  WaiterOn = FALSE
  Watched = "m1"
  Variant = "fixed"
INIT Init
NEXT Next
CHECK_DEADLOCK FALSE
INVARIANTS
  ExitLineWritten
  ReportsCommandStatus
  SettledBlockCloses
  NeverCloseWorking
