name: attribution

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  no-claude-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No Claude attribution in the commits or the PR description
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the description now: a run queued before an edit carries the old one.
          BODY=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          pattern='noreply@anthropic\.com|Co-Authored-By: Claude|Claude-Session:|Generated (with|by) \[?Claude Code|claude\.ai/code/session_|claude-projects-attribution'
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if git log -1 --format='%an <%ae>%n%cn <%ce>%n%B' "$sha" | grep -iqE "$pattern"; then
              echo "::error::commit $sha has Claude attribution:"
              git log -1 --format='%an <%ae>%n%cn <%ce>%n%B' "$sha" | grep -iE "$pattern"
              status=1
            fi
          done
          if printf '%s' "$BODY" | grep -iqE "$pattern"; then
            echo "::error::the PR description has Claude attribution:"
            printf '%s\n' "$BODY" | grep -iE "$pattern"
            status=1
          fi
          exit "$status"
