name: shared-skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  identical-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared skills are identical in every plugin
        run: |
          # Each line: a skill folder that swe, lab, and uni each carry.
          status=0
          for skill in go-deeper; do
            for plugin in lab uni; do
              if ! diff -r "plugins/swe/skills/$skill" "plugins/$plugin/skills/$skill"; then
                echo "::error::plugins/$plugin/skills/$skill differs from plugins/swe/skills/$skill"
                status=1
              fi
            done
          done
          exit $status
      - name: Antigravity rules match the session-start hook
        run: |
          # Antigravity CLI skips hooks/hooks.json and loads rules/AGENTS.md
          # instead. The eval harness rejects symlinks, so it is a copy.
          status=0
          for plugin in swe lab uni; do
            if ! diff "plugins/$plugin/hooks/session-start.md" "plugins/$plugin/rules/AGENTS.md"; then
              echo "::error::plugins/$plugin/rules/AGENTS.md differs from plugins/$plugin/hooks/session-start.md"
              status=1
            fi
          done
          exit $status
