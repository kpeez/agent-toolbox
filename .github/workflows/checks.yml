name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Hook TypeScript type-checks
        run: |
          npm ci --prefix .github/typecheck
          npx --prefix .github/typecheck tsc -p .github/typecheck/tsconfig.json
      - name: Statechart TypeScript type-checks
        run: |
          npm install --prefix plugins/swe/skills/statechart/scripts --no-package-lock --no-audit --no-fund
          npx --prefix .github/typecheck tsc -p plugins/swe/skills/statechart/scripts/tsconfig.json --typeRoots .github/typecheck/node_modules/@types
      - name: Shared skills are identical in every plugin
        run: |
          # Each line: a skill folder that swe, lab, and uni each carry.
          status=0
          for skill in go-deeper; do
            for plugin in lab uni; do
              if ! diff -r "plugins/swe/skills/$skill" "plugins/$plugin/skills/$skill"; then
                echo "::error::plugins/$plugin/skills/$skill differs from plugins/swe/skills/$skill"
                status=1
              fi
            done
          done
          exit $status
      - name: Catalogs list every plugin folder, and manifests agree on names
        run: uv run .github/scripts/plugin_catalogs.py
      - name: No plugin names another plugin's skills
        run: uv run .github/scripts/plugin_isolation.py
      - name: No home-folder paths in tracked files
        run: uv run .github/scripts/private_paths.py
      - name: No plugin manifest or catalog entry sets a version
        run: uv run .github/scripts/manifest_versions.py
      - name: Hook runtimes follow the per-event table
        run: uv run .github/scripts/hook_runtime.py
      - name: No plugin TypeScript uses import.meta.main
        run: uv run .github/scripts/import_meta_main.py
      - name: Every named path, heading, skill, step, and eval target exists
        run: uv run .github/scripts/stale_references.py
      - name: Antigravity rules match the session-start hook
        run: |
          # Antigravity CLI skips hooks/hooks.json and loads rules/AGENTS.md
          # instead. The eval harness rejects symlinks, so it is a copy.
          status=0
          for plugin in swe lab uni; do
            if ! diff "plugins/$plugin/hooks/session-start.md" "plugins/$plugin/rules/AGENTS.md"; then
              echo "::error::plugins/$plugin/rules/AGENTS.md differs from plugins/$plugin/hooks/session-start.md"
              status=1
            fi
          done
          exit $status
      - name: Skills name model roles, not model names
        run: |
          # Exit 1 from grep means no match. Any status above 1 is a grep error and fails the step.
          status=0
          found=$(grep -rnwiE 'opus|sonnet|haiku' plugins) || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::grep failed with status $status"
            exit 1
          fi
          hits=$(printf '%s\n' "$found" | grep -v '^plugins/[^/]*/agents/' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            exit 1
          fi
      - name: Eval facet map and router Playbooks entries match the skill sources
        run: uv run evals/skills/facets.py check
      - name: Eval cases are valid
        run: uv run evals/skills/skill_eval.py validate
      - name: Unit tests
        run: |
          status=0
          for suite in evals/skills/tests plugins/lab/skills/autoresearch/scripts/tests; do
            uv run -m unittest discover -s "$suite" || status=1
          done
          node --test plugins/swe/skills/ship-pr/scripts/tests/ || status=1
          node --test plugins/rex-agents/scripts/tests/ || status=1
          exit $status

  claude-mods-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # The mod tests import 'claude-code/testing', which only `claude plugin test` provides.
      - name: Install Claude Code, the only runner of the mod tests
        run: npm install -g @anthropic-ai/claude-code@2.1.330
      - name: Every mod's tests pass
        run: |
          status=0
          for mod in claude-mods/*/; do
            claude plugin test "$mod" || status=1
          done
          exit $status

  tech-tree-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Tech-tree rules hold in every reachable state
        run: uv run .agents/skills/verify-tech-tree/scripts/check.py

  hook-runtime-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4'
      - name: Install fish
        run: sudo apt-get update -q && sudo apt-get install -y -q fish
      # Node 22.18 is the oldest Node that strips types. Node 24.1 is the newest without import.meta.main.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
      - run: echo "NODE_22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.1.0'
      - name: Every hook has the same effect under sh and fish, on bun and on Node 22.18 and 24.1
        run: uv run .github/scripts/hook_matrix.py --runtime "$(command -v bun)" --runtime "$NODE_22" --runtime "$(command -v node)"

  rex-mirror-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache: false
      - name: Install the statechart skill's pinned TLC and Java
        run: uv run .github/scripts/statechart_tlc.py >> "$GITHUB_ENV"
      - name: Rex mirror rules hold, and each past bug breaks them
        timeout-minutes: 5
        run: uv run .agents/skills/verify-rex-mirror/scripts/check.py

  statechart-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ['1/3', '2/3', '3/3']
    name: statechart-tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache: false
      # render.test.ts installs pele, mermaid, and jsdom at pinned versions.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/statechart
          key: statechart-render-${{ hashFiles('plugins/swe/skills/statechart/scripts/test/render.test.ts') }}
      - name: Install the statechart skill's pinned TLC and Java
        run: uv run .github/scripts/statechart_tlc.py >> "$GITHUB_ENV"
      - name: Statechart tests with real TLC
        working-directory: plugins/swe/skills/statechart/scripts
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          npm install --no-package-lock --no-audit --no-fund
          node --disable-warning=ExperimentalWarning --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/statechart.tap" --test-shard="$SHARD" test/*.test.ts
          # A TLC test skips when TLA2TOOLS is unset. In CI, every test must run.
          if ! grep -qx '# skipped 0' "$RUNNER_TEMP/statechart.tap"; then
            echo "::error::statechart tests were skipped; check that TLA2TOOLS is set"
            exit 1
          fi

  eval-budget-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache: false
      - name: Install the statechart skill's pinned TLC and Java
        run: uv run .github/scripts/statechart_tlc.py >> "$GITHUB_ENV"
      - name: Eval-batch budget rules hold in every model state and on the real code
        timeout-minutes: 2
        run: uv run .agents/skills/verify-eval-budget/scripts/check.py

  project-skill-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: The swe and lab link scripts are identical
        run: diff plugins/swe/scripts/link_project_skill.py plugins/lab/scripts/link_project_skill.py
      - name: The link script works end to end in throwaway repositories
        run: uv run .agents/skills/verify-project-skill-link/scripts/check.py

  autoresearch-cleanup-crash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: A crash at any point of autoresearch cleanup keeps the original run recoverable
        timeout-minutes: 5
        run: uv run .agents/skills/verify-autoresearch-cleanup/scripts/check.py

  plugin-rollout-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache: false
      - name: Install the statechart skill's pinned TLC and Java
        run: uv run .github/scripts/statechart_tlc.py >> "$GITHUB_ENV"
      - name: Plugin rollout rules hold, and each past bug breaks them
        timeout-minutes: 2
        run: uv run .agents/skills/verify-plugin-rollout/scripts/check.py
